name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath \
            -ldflags "-s -w -X github.com/karitham/thrift-ls/lsp.ServerVersion=${VERSION#v}" \
            -o "dist/thrift-ls-${{ matrix.goos }}-${{ matrix.goarch }}$ext" .
      - uses: actions/upload-artifact@v4
        with:
          name: thrift-ls-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: package
        working-directory: vscode
        run: |
          npm ci
          npm run test
          [ "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}" ] || {
            echo "vsix version does not match tag $GITHUB_REF_NAME"
            exit 1
          }
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode/*.vsix

  release:
    needs: [checksums, vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
