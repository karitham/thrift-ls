name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # One target list, read by both the build loop and the artifact
  # verification, so adding a target cannot silently weaken the publish guard.
  TARGETS: linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64

jobs:
  # VERSION is authoritative for every versioned artifact: flake.nix, the VS
  # Code extension's package script, and jetbrains/build.gradle.kts each read
  # it. The extension packages with --no-update-package-json, so
  # package.json's checked-in version is never the packaged version. The gate
  # therefore compares VERSION with the tag.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: assert version agrees with the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          value=$(cat VERSION)
          if [ "$value" != "$tag" ]; then
            printf 'VERSION is %s, tag is %s\n' "$value" "$tag"
            exit 1
          fi

  # One job for all six targets: the build sets CGO_ENABLED=0, so the targets
  # share one module cache, and a matrix would multiply runner startups.
  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: build
        run: |
          for target in $TARGETS; do
            goos=${target%-*}
            goarch=${target#*-}
            ext=""
            [ "$goos" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath \
              -ldflags "-s -w -X github.com/karitham/thrift-ls/lsp.ServerVersion=${VERSION}" \
              -o "dist/thrift-ls-$target$ext" .
          done
      - uses: actions/upload-artifact@v7
        with:
          name: thrift-ls
          path: dist/

  # The tag points at a commit that already passed CI. Running the suite here
  # again keeps the release independent of that history.
  test:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test
        run: go test -race ./...

  vsix:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: package
        working-directory: vscode
        run: |
          npm ci
          npm run test
          npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vscode/*.vsix

  jetbrains:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # setup-gradle keys its Gradle User Home cache on the Gradle build files
      # rather than the git SHA, so the extracted IDE distributions are reused
      # across commits. The v4 key ended in the SHA, so every run started cold.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'
      - name: Test and package plugin
        run: gradle -p jetbrains -Pide=goland test buildPlugin verifyPlugin
      - uses: actions/upload-artifact@v7
        with:
          name: jetbrains
          path: jetbrains/build/distributions/*.zip

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          ls -la
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  # The action creates a standard release as a draft, uploads the assets, and
  # then un-drafts it, which satisfies immutable releases. Prereleases in
  # ci.yml take a different path and need an explicit publish step.
  release:
    needs: [build, test, checksums, vsix, jetbrains]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      # Fail before publishing a partial set. Immutable releases lock the
      # asset list at publish time, so an artifact missed here cannot be added
      # later, and upload-artifact only warns when a job produces no file.
      - name: verify artifact set
        run: |
          set -euo pipefail
          missing=0
          for target in $TARGETS; do
            ext=""
            [ "${target%-*}" = windows ] && ext=".exe"
            f="artifacts/thrift-ls-$target$ext"
            [ -f "$f" ] || { echo "missing $f"; missing=1; }
          done
          for pat in '*.vsix' '*.zip' 'checksums.txt'; do
            n=$(find artifacts -maxdepth 1 -name "$pat" -type f | wc -l)
            [ "$n" -eq 1 ] || { echo "expected exactly 1 $pat, found $n"; missing=1; }
          done
          [ "$missing" -eq 0 ] || { ls -la artifacts; exit 1; }
      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: artifacts/*
