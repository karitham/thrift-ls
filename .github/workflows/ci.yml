name: ci

on:
  push:
    branches: [main]
  pull_request:

# A pull request cancels the previous run for the same ref, so only the newest
# checks report a status. A push does not, because dev-release attaches assets
# to a release tag and a cancelled upload leaves a draft behind.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The build loop and the artifact verification both read this list, so
  # adding a target updates both.
  TARGETS: linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64

jobs:
  # Build every supported target so cross-compilation breaks appear on the
  # pull request, not at the release. One job, not a matrix: the build sets
  # CGO_ENABLED=0, so the targets share one module cache and one toolchain,
  # and a matrix would pay six runner startups and six module downloads.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: build
        run: |
          for target in $TARGETS; do
            goos=${target%-*}
            goarch=${target#*-}
            ext=""
            [ "$goos" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath \
              -ldflags "-s -w -X github.com/karitham/thrift-ls/lsp.ServerVersion=${VERSION}-dev.${GITHUB_SHA:0:7}" \
              -o "dist/thrift-ls-$target$ext" .
          done
      - uses: actions/upload-artifact@v7
        with:
          name: thrift-ls
          path: dist/

  # Test every package: unit, golden (formatter/file_test.go +
  # tests/e2e fixtures), corpus (check_test.go + tests/made-in-abyss),
  # and fuzz regression.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test
        run: go test -race ./...

  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      # The extension's version comes from the root VERSION file. The -dev
      # suffix makes a dev vsix resolve its own commit's release: platform.ts
      # maps "<version>-dev.<shortsha>" to tag "dev-<shortsha>".
      - name: package
        working-directory: vscode
        run: |
          export THRIFT_LS_VERSION="${VERSION}-dev.${GITHUB_SHA:0:7}"
          npm ci
          npm run test
          npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vscode/*.vsix

  jetbrains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # setup-gradle v6 caches the downloaded IDE distributions as separate
      # entries keyed on their content, so later commits restore them.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'
      # build.gradle.kts reads VERSION and appends this suffix, so the plugin
      # ZIP names the commit it was built from.
      - name: Test and package plugin
        run: |
          export THRIFT_LS_VERSION_SUFFIX="-dev.${GITHUB_SHA:0:7}"
          gradle -p jetbrains -Pide=goland test buildPlugin verifyPlugin
      - uses: actions/upload-artifact@v7
        with:
          name: jetbrains
          path: jetbrains/build/distributions/*.zip

  # Each main push attaches the binaries, the vsix, and the plugin to a
  # prerelease tagged with the short commit SHA. Prereleases never resolve as
  # `releases/latest`, so the extension's downloader keeps serving tagged
  # releases. The tag carries a prefix because GitHub rejects ref names made of
  # 40 or 60 hex characters alone.
  #
  # A dev vsix resolves its own commit's release (platform.ts maps
  # "<version>-dev.<shortsha>" to tag "dev-<shortsha>"). Old dev releases are
  # therefore kept: deleting one breaks every dev vsix that still resolves it.
  dev-release:
    needs: [build, test, vsix, jetbrains]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Publishes run one at a time. The workflow-level group does not cancel
    # runs on pushes, so this group serialises them.
    concurrency:
      group: dev-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: short sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
      # Fail before publishing a partial set. Immutable releases lock the
      # asset list at publish time, so an artifact missed here cannot be added
      # later, and upload-artifact only warns when a job produces no file.
      - name: verify artifact set
        run: |
          set -euo pipefail
          missing=0
          for target in $TARGETS; do
            ext=""
            [ "${target%-*}" = windows ] && ext=".exe"
            f="artifacts/thrift-ls-$target$ext"
            [ -f "$f" ] || { echo "missing $f"; missing=1; }
          done
          for pat in '*.vsix' '*.zip' 'checksums.txt'; do
            n=$(find artifacts -maxdepth 1 -name "$pat" -type f | wc -l)
            [ "$n" -eq 1 ] || { echo "expected exactly 1 $pat, found $n"; missing=1; }
          done
          [ "$missing" -eq 0 ] || { ls -la artifacts; exit 1; }
      # The repository has immutable releases enabled, so the asset list locks
      # when a release is published. The action publishes prereleases
      # immediately, which makes each asset upload after it fail. Keep the
      # release a draft while the assets attach, then publish it.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: dev-${{ env.SHORT_SHA }}
          name: "dev build ${{ env.SHORT_SHA }}"
          prerelease: true
          draft: true
          files: artifacts/*
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh resolves the repository from GH_REPO or a git remote. This job
          # has no checkout, so there is no remote to read.
          GH_REPO: ${{ github.repository }}
        run: gh release edit "dev-${{ env.SHORT_SHA }}" --draft=false
